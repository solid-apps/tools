<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root { --text: #171b26; --dim: #5d6679; --accent: #6d4aff; --accent-soft: #a78bfa; --font: -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; font-family: var(--font); color: var(--text); overflow: hidden; position: relative;
    background: linear-gradient(180deg, #f8f8fd 0%, #f3f2fb 60%, #ecebf7 100%); }
  body::before, body::after { content: ''; position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; }
  body::before { width: 620px; height: 620px; top: -230px; right: -150px; background: rgba(109, 74, 255, 0.16); }
  body::after { width: 560px; height: 560px; bottom: -250px; left: -170px; background: rgba(167, 139, 250, 0.22); }
  .card { position: relative; height: 100%; padding: 64px 72px; display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 650; font-size: 30px; letter-spacing: -0.01em; margin-bottom: 44px; }
  .dot { width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, var(--accent-soft), var(--accent)); display: grid; place-items: center; }
  .dot svg { width: 32px; height: 32px; }
  h1 { font-size: 66px; line-height: 1.04; font-weight: 750; letter-spacing: -0.035em; margin-bottom: 26px; }
  h1 span { color: var(--accent); }
  p.tag { font-size: 27px; line-height: 1.4; color: var(--dim); max-width: 560px; }
  .site { position: absolute; left: 72px; bottom: 44px; font-size: 21px; color: var(--dim); font-weight: 550; }
  .panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(23, 27, 38, 0.08); border-radius: 26px; padding: 28px; box-shadow: 0 24px 60px rgba(60, 40, 140, 0.14); }
  .panel h2 { font-size: 23px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.01em; }
  .step { border: 1px solid #e3e3f0; background: #fafaff; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .step b { display: block; font-size: 19px; margin-bottom: 4px; }
  .step code { font: 500 16px/1.4 ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, monospace; color: #3b3f66; }
  .go { margin-top: 8px; display: inline-block; background: var(--accent); color: #fff; font-weight: 700; font-size: 20px; padding: 13px 24px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="brand">
        <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.500 14v7M14 17.500h7"/></svg></div>
        Tools
      </div>
      <h1>Your panes and apps, <span>in your pod</span></h1>
      <p class="tag">Set up a tool index: your own private list of the tools you want to use on your data.</p>
    </div>
    <div class="panel">
      <h2>Two changes, shown first</h2>
      <div class="step"><b>A new file</b><code>settings/toolIndex.jsonld</code></div>
      <div class="step"><b>One line added</b><code>settings/prefs.jsonld</code></div>
      <span class="go">Create my tool index</span>
    </div>
  </div>
  <div class="site">solid-apps.github.io/tools</div>
</body>
</html>
